<!-- Employee mode -->
<ng-container *ngIf="!isLeaveMode">
  <tr class="emp_row" *ngFor="let emp of data">
    <td *ngFor="let col of columns">

      <ng-container *ngIf="col.type === 'avatar'">
        <div class="name_cell">
          <div class="avatar">{{ getInitials(emp.name) }}</div>
          <div class="name_info">
            <span class="emp_name">{{ emp.name }}</span>
            <span class="emp_role">{{ emp.role }}</span>
          </div>
        </div>
      </ng-container>

      <ng-container *ngIf="col.type === 'text'">
        <span class="emp_email">{{ emp[col.key] }}</span>
      </ng-container>

      <ng-container *ngIf="col.type === 'date'">
        <span class="emp_date">{{ emp[col.key] }}</span>
      </ng-container>

      <ng-container *ngIf="col.type === 'toggle'">
        <div class="status_cell">
          <label class="toggle_switch">
            <input type="checkbox" [checked]="emp[col.key]" (change)="onToggleStatus(emp)" />
            <span class="toggle_slider"></span>
          </label>
        </div>
      </ng-container>

    </td>
    <td class="col_edit">
      <button class="action_btn view employee_edit_btn">
        <i class="bi bi-pencil-square"></i>
      </button>
    </td>
  </tr>
</ng-container>

<!-- Leave mode -->
<ng-container *ngIf="isLeaveMode">
  <tr class="emp_row" *ngFor="let row of data">
    <td *ngFor="let col of columns">
      
      <ng-container *ngIf="col.type === 'avatar'">
        <div class="name_cell">
          <div class="avatar">{{ getInitials(row[col.key]) }}</div>
          <div class="name_info">
            <span class="emp_name">{{ row[col.key] }}</span>
            <span class="emp_role">{{ row['employeeId'] }}</span>
          </div>
        </div>
      </ng-container>

    
      <ng-container *ngIf="col.type === 'text'">
        <span class="emp_email">{{ row[col.key] }}</span>
      </ng-container>

      <ng-container *ngIf="col.type === 'date'">
        <span class="emp_date custom_date">{{ row[col.key] }}</span>
      </ng-container>

      <ng-container *ngIf="col.type === 'status-action'">
        <span class="status_badge"
          [class.pending]="row['status'] === 'Pending'"
          [class.accepted]="row['status'] === 'Accepted'"
          [class.rejected]="row['status'] === 'Rejected'">
          {{ row['status'] }}
        </span>
      </ng-container>

    </td>
    <td class="col_edit" [class.only_view]="row['status'] !== 'Pending'">
      <button class="action_btn view" >
        <i class="bi bi-eye"></i>
      </button>  
  <ng-container *ngIf="row['status'] === 'Pending'">
    <button class="action_btn accept">
      <i class="bi bi-check-lg"></i>
    </button>
    <button class="action_btn reject">
      <i class="bi bi-x"></i>
    </button>
  </ng-container>
    </td>
  </tr>
</ng-container>
