  <!-- Hamburger button (mobile only) -->
  <button class="hamburger-btn"  *ngIf="!isSidebarOpen" (click)="toggleSidebar()">
    <i class="bi bi-list"></i>
  </button>

  <!-- Dark overlay (mobile only) -->
<div
  class="sidebar-overlay"
  [class.active]="isSidebarOpen"
  (click)="closeSidebar()"
></div>

<!-- // Sidebar container -->
<div class="sidebar_container" [class.open]="isSidebarOpen">
  <!-- ─── Logo ─── -->
  <div class="logo-container">
    <div class="logo-icon">
      <i class="bi bi-buildings-fill"></i>
    </div>
    <span class="title">HRM Portal</span>

    <!-- Close button (mobile only) -->
    <button class="close-btn" (click)="closeSidebar()">
      <i class="bi bi-x-lg"></i>
    </button>
  </div>

  <!-- ─── Nav Menu ─── -->
  <ul class="sidemenu-container">
    <li class="sidemenu-item" *ngFor="let item of subMenus">
      
 <a
  class="sidebar_link"
  [routerLink]="item.route"
  routerLinkActive="active"
  [class.active]="activeMenu === item.name"
  (click)="setActive(item.name)"
>
        <!-- Icon -->
        <span class="menu-icon">
          <i [class]="item.icon"></i>
        </span>

        <!-- Label -->
        <span class="menu-text">{{ item.name }}</span>

        <!-- Active dot -->
        <span class="active-dot" *ngIf="activeMenu === item.name"></span>
      </a>
    </li>
  </ul>

  <!-- ─── Logout ─── -->
  <div class="bottom-container">
    <a class="logout-link" [class.active]="activeMenu === 'logout'" (click)="activeMenu = 'logout'">
      <i class="bi bi-box-arrow-right"></i>
      <span>Logout</span>
    </a>
  </div>
</div>
