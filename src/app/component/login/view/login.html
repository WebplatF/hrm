<div class="page">

  <!-- <div class="bg" aria-hidden="true">
    <span class="blob blob--tr"></span>
    <span class="blob blob--bl"></span>
  </div> -->

  <main class="wrap">

    <div class="brand">
        <div class="brand__logo">
    <img
      src="/assets/flag/logo.png"
      alt="HRM Logo"
      class="brand__logo-img"
    />
  </div>
      <h1 class="brand__title">Welcome back</h1>
      <p class="brand__sub">Log in to manage your HR operations effortlessly.</p>
    </div>

    <div class="card">
      <form class="form" [formGroup]="loginform" (ngSubmit)="onSubmit()" novalidate>

        <!-- Email -->
        <div class="field" [class.field--err]="submitted && f['email'].errors">
          <label class="label" for="email">Email</label>
          <input
            id="email"
            type="email"
            class="input"
            formControlName="email"
            placeholder="Enter the Email"
            autocomplete="email"
          />
          <span class="err" *ngIf="submitted && f['email'].errors">
            <ng-container *ngIf="f['email']?.errors?.['required']">Email is required.</ng-container>
            <ng-container *ngIf="f['email']?.errors?.['email']">Enter a valid email.</ng-container>
          </span>
        </div>

        <!-- Password -->
        <div class="field" [class.field--err]="submitted && f['password'].errors">
          <div class="label-row">
            <label class="label" for="password">Password</label>
            <a class="link" routerLink="/forgot-password">Forgot password?</a>
          </div>
          <div class="input-wrap">
            <input
              id="password"
              [type]="showPassword ? 'text' : 'password'"
              class="input input--icon"
              formControlName="password"
              placeholder="Enter the Password"
              autocomplete="current-password"
            />
            <button type="button" class="eye" (click)="togglePassword()"
              [attr.aria-label]="showPassword ? 'Hide password' : 'Show password'">
              <svg *ngIf="showPassword" xmlns="http://www.w3.org/2000/svg" width="18" height="18"
                viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                stroke-linecap="round" stroke-linejoin="round">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                <circle cx="12" cy="12" r="3"/>
              </svg>
              <svg *ngIf="!showPassword" xmlns="http://www.w3.org/2000/svg" width="18" height="18"
                viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                stroke-linecap="round" stroke-linejoin="round">
                <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/>
                <line x1="1" y1="1" x2="23" y2="23"/>
              </svg>
            </button>
          </div>
          <span class="err" *ngIf="submitted && f['password'].errors">
            <ng-container *ngIf="f['password']?.errors?.['required']">Password is required.</ng-container>
            <ng-container *ngIf="f['password']?.errors?.['minlength']">Minimum 6 characters.</ng-container>
          </span>
        </div>

        <!-- Remember me -->
        <label class="check">
          <input class="check__input" type="checkbox" />
          <span class="check__box"></span>
          <span class="check__text">Remember this device</span>
        </label>

        <!-- API error -->
        <!-- <p class="api-err" *ngIf="error$ | async as err">{{ err }}</p> -->

        <!-- Submit -->
         <button type="submit" class="btn" [disabled]="state.loading()">
  @if (state.loading()) {
    <span class="spinner-border spinner-border-sm me-2"></span>
    Signing In...
  } @else {
    Sign In
  }
</button>


      </form>
    </div>

    <p class="note">
      <span class="note-head">New to the platform?</span>
      <a class="note__link" routerLink="/contact">Contact your administrator</a>
    </p>

  </main>

  <footer class="footer">
    <span>&copy; 2026 HRM Cloud Services. All rights reserved.</span>
    <span class="footer__dot">•</span>
    <a class="footer__link" routerLink="/privacy">Privacy Policy</a>
    <span class="footer__dot">•</span>
    <a class="footer__link" routerLink="/terms">Terms of Service</a>
  </footer>

</div>
