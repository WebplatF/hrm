<app-loading *ngIf="state.loading()"></app-loading>
<div class="employeelist">
  <div class="header">
    <div class="header_info">
      <h1 class="header_title">{{ title() }}</h1>
      <p class="header_subtitle">{{ subtitle() }}</p>
    </div>
    @if (showBtn()) {
      <button class="header_btn" (click)="createEmployee()">
        <span class="btn_icon">+</span>
        Add Employee
      </button>
    }
  </div>

  <app-tablebody
    tableTitle="Employee Directory"
    [columns]="columns"
    [data]="Employees"
    mode="employee"
    [showActions]="false"
    [showActionLabel]="true"
    (pageChange)="loadPage($event)"
    (onEdit)="editEmployee($event)"
   
  />
    <!-- (toggleStatus)="onToggle($event)"  -->
</div>
